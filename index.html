<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f4">
<meta name="apple-mobile-web-app-title" content="暗記大会 地図編">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>暗記大会 世界地図編</title>
<style>
:root{--bg:#e7eaee;--card:#f4f5f7;--ink:#172033;--muted:#667085;--line:#d5dae0;--accent:#2457d6;--accent2:#173d98;--soft:#e7edf8;--red:#dc2626;--pink:#f59aa5;--radius:22px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
button,select{font:inherit}button{touch-action:manipulation}
.app{max-width:760px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 2px 16px}
h1{font-size:clamp(25px,6vw,34px);margin:0;line-height:1.15}.badge{font-size:12px;font-weight:800;background:var(--soft);color:var(--accent2);padding:8px 11px;border-radius:999px;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.lead{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{min-width:0}label{display:block;font-size:12px;font-weight:800;color:#475467;margin:0 0 7px}
select{width:100%;height:48px;border:1px solid #cfd7e4;border-radius:12px;background:#fff;color:var(--ink);font-size:16px;padding:0 12px;outline:none}
.actions{display:flex;gap:10px;margin-top:17px}button{border:0;border-radius:13px;min-height:50px;padding:0 16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;flex:1}.secondary{background:#e1e6ed;color:#344054}.flip-btn{width:100%;margin-bottom:10px;background:#fff;border:1px solid #bfc9d8;color:var(--accent2)}button:disabled{opacity:.38}.small-note{font-size:12px;color:var(--muted);line-height:1.6;margin:13px 0 0}.hidden{display:none!important}
.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:3px 2px 10px}.top-home-btn{background:#fff;border:1px solid var(--line);color:#475467;min-height:42px;padding:0 14px;white-space:nowrap}.quiz-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0;flex:1}.progress-label{font-size:13px;font-weight:850;color:#344054;text-align:right}.progress-track{height:6px;background:#d9dee5;border-radius:999px;overflow:hidden;margin-bottom:14px}.progress-bar{height:100%;background:var(--accent);width:0;transition:width .18s ease}
.scene{perspective:1200px;height:min(61vh,560px);min-height:430px}.flashcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1);cursor:default;-webkit-tap-highlight-color:transparent}.flashcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;padding:18px 16px;overflow:auto}.back{transform:rotateY(180deg)}.face-label{font-size:12px;font-weight:850;color:var(--accent2);background:var(--soft);padding:6px 10px;border-radius:999px;align-self:flex-start}.prompt{text-align:center;font-size:19px;font-weight:800;margin:12px 0 8px}
.map-wrap{position:relative;width:100%;aspect-ratio:2/1;margin:auto;overflow:hidden;border-radius:14px;touch-action:manipulation;cursor:zoom-in;background:#eef1f4}.map-wrap.zoomed{cursor:zoom-out}.map-stage{position:absolute;inset:0;transform-origin:0 0;will-change:transform;transition:transform .28s ease}.map-wrap img{display:block;width:100%;height:100%;object-fit:contain}.map-base{position:absolute;inset:0}.country-highlight{position:absolute;inset:0;pointer-events:none}.marker{position:absolute;width:clamp(22px,5.5vw,38px);height:clamp(22px,5.5vw,38px);border:4px solid var(--red);border-radius:50%;transform:translate(-50%,-50%);transform-origin:center;pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.75)}
.answer-name{font-size:clamp(27px,8vw,42px);font-weight:850;line-height:1.45;text-align:center;margin:12px 0 14px}.answer-map{width:100%;max-width:500px;margin:auto}.tap-hint{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
.nav{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:5;padding-top:12px;background:linear-gradient(to bottom,rgba(231,234,238,0),var(--bg) 30%)}.nav-row{display:grid;grid-template-columns:1fr 1.45fr;gap:10px}
.finish-panel h2{margin:0 0 8px;font-size:27px}.finish-panel p{margin:0;color:var(--muted);line-height:1.7}
@media(max-width:560px){.app{padding:12px 11px calc(22px + env(safe-area-inset-bottom))}.grid{grid-template-columns:1fr}.scene{height:58vh;min-height:410px;max-height:590px}.face{padding:15px 12px}.prompt{font-size:17px}.marker{border-width:3px}}
@media(max-height:700px) and (max-width:560px){.scene{height:52vh;min-height:350px}.prompt{margin:8px 0 4px}}
@media(prefers-reduced-motion:reduce){.flashcard{transition:none}}
</style>
</head>
<body>
<div class="app">
<header><h1>暗記大会 世界地図編</h1><div id="totalBadge" class="badge">読込中</div></header>
<section id="setup" class="panel">
<p class="lead">世界地図でピンク色に塗られ、赤い丸で示された国を答えます。地図をタップすると拡大表示と全体表示を切り替えられます。</p>
<div class="grid">
 <div class="field"><label for="count">カード枚数</label><select id="count"><option value="5">5枚</option><option value="10">10枚</option><option value="20">20枚</option><option value="50">50枚</option><option value="all" selected>全部</option></select></div>
 <div class="field"><label for="order">出題順</label><select id="order"><option value="random" selected>ランダム</option><option value="sequential">順番</option></select></div>
</div>
<div class="actions"><button id="startBtn" class="primary" type="button" disabled>カードを開始</button></div>
<p id="status" class="small-note">国データを読み込んでいます。</p>
</section>
<section id="quiz" class="hidden">
 <div class="quiz-top"><button id="homeBtn" class="top-home-btn" type="button">← ホーム</button><div class="quiz-meta"><div id="progressLabel" class="progress-label"></div></div></div>
 <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
 <div class="scene" aria-live="polite">
  <div id="card" class="flashcard">
   <div class="face front"><div class="face-label">問題</div><div class="prompt">国名を答えなさい</div><div id="frontMap" class="map-wrap" role="button" tabindex="0" aria-label="地図をタップして拡大"><div class="map-stage"><img class="map-base" src="./world_map.svg" alt="国境線のある世界地図"><img id="frontHighlight" class="country-highlight" alt=""><span id="frontMarker" class="marker"></span></div></div><div class="tap-hint">地図をタップ：拡大表示 ⇄ 全体表示</div></div>
   <div class="face back"><div class="face-label">答え</div><div id="answerName" class="answer-name"></div><div id="backMap" class="map-wrap answer-map" role="button" tabindex="0" aria-label="地図をタップして拡大"><div class="map-stage"><img class="map-base" src="./world_map.svg" alt="国境線のある世界地図"><img id="backHighlight" class="country-highlight" alt=""><span id="backMarker" class="marker"></span></div></div><div class="tap-hint">地図をタップ：拡大表示 ⇄ 全体表示</div></div>
  </div>
 </div>
 <div class="nav"><button id="flipBtn" class="flip-btn" type="button">答えを見る</button><div class="nav-row"><button id="prevBtn" class="secondary" type="button">前へ</button><button id="nextBtn" class="primary" type="button">次へ</button></div></div>
</section>
<section id="finish" class="panel finish-panel hidden"><h2>終了</h2><p id="finishText"></p><div class="actions"><button id="againBtn" class="secondary" type="button">もう一度</button><button id="settingsBtn" class="primary" type="button">ホームへ</button></div></section>
</div>
<script>
let DATA=[];const $=id=>document.getElementById(id);const el={setup:$('setup'),quiz:$('quiz'),finish:$('finish'),count:$('count'),order:$('order'),start:$('startBtn'),card:$('card'),frontMarker:$('frontMarker'),backMarker:$('backMarker'),frontHighlight:$('frontHighlight'),backHighlight:$('backHighlight'),frontMap:$('frontMap'),backMap:$('backMap'),answer:$('answerName'),progress:$('progressLabel'),bar:$('progressBar'),flip:$('flipBtn'),prev:$('prevBtn'),next:$('nextBtn'),home:$('homeBtn'),again:$('againBtn'),settings:$('settingsBtn'),finishText:$('finishText'),badge:$('totalBadge'),status:$('status')};let session=null;
async function loadData(){try{const r=await fetch('./countries.json',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();DATA=d.countries||[];if(!DATA.length)throw new Error('empty');el.badge.textContent=`全 ${DATA.length} か国`;el.status.textContent='国データを読み込みました。';el.start.disabled=false}catch(e){console.error(e);el.badge.textContent='読込エラー';el.status.textContent='countries.jsonを読み込めませんでした。';}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selected(){let a=DATA.slice();if(el.order.value==='random')a=shuffle(a);const n=el.count.value==='all'?a.length:Math.min(+el.count.value,a.length);return a.slice(0,n)}
function start(){const cards=selected();if(!cards.length)return;session={cards,index:0};el.setup.classList.add('hidden');el.finish.classList.add('hidden');el.quiz.classList.remove('hidden');render();scrollTopSmooth()}
function scrollTopSmooth(){window.scrollTo({top:0,behavior:'smooth'})}function isFlipped(){return el.card.classList.contains('flipped')}function setFlip(v){el.card.classList.toggle('flipped',v);el.flip.textContent=v?'問題に戻る':'答えを見る'}function toggleFlip(){setFlip(!isFlipped())}
function placeMarker(node,x,y){node.style.left=`${x}%`;node.style.top=`${y}%`}
function render(){const x=session.cards[session.index],i=session.index,n=session.cards.length;setFlip(false);resetMapView(el.frontMap);resetMapView(el.backMap);el.answer.textContent=x.name;const hi=`./highlights/${x.id}.svg`;el.frontHighlight.src=hi;el.backHighlight.src=hi;placeMarker(el.frontMarker,x.x,x.y);placeMarker(el.backMarker,x.x,x.y);setMapCountry(el.frontMap,x);setMapCountry(el.backMap,x);el.progress.textContent=`${i+1} / ${n} 枚`;el.bar.style.width=`${(i+1)/n*100}%`;el.prev.disabled=i===0;el.next.textContent=i===n-1?'終了':'次へ'}
function prev(){if(session.index>0){session.index--;render();scrollTopSmooth()}}function next(){if(session.index<session.cards.length-1){session.index++;render();scrollTopSmooth()}else finish()}function home(){session=null;setFlip(false);el.quiz.classList.add('hidden');el.finish.classList.add('hidden');el.setup.classList.remove('hidden');scrollTopSmooth()}function finish(){el.quiz.classList.add('hidden');el.finish.classList.remove('hidden');el.finishText.textContent=`${session.cards.length}枚のカードを確認しました。`;scrollTopSmooth()}function again(){start()}function settings(){home()}
const mapStates=new WeakMap();
function getMapState(map){if(!mapStates.has(map))mapStates.set(map,{zoomed:false,country:null});return mapStates.get(map)}
function setMapCountry(map,country){const st=getMapState(map);st.country=country;st.zoomed=false;map.classList.remove('zoomed');applyMapView(map)}
function applyMapView(map){const st=getMapState(map),stage=map.querySelector('.map-stage'),marker=map.querySelector('.marker');if(!st.country||!st.zoomed){stage.style.transform='translate(0px,0px) scale(1)';marker.style.transform='translate(-50%,-50%) scale(1)';map.classList.remove('zoomed');return}const scale=Number(st.country.zoom||4),w=map.clientWidth,h=map.clientHeight,x=st.country.x/100*w,y=st.country.y/100*h;let tx=w/2-x*scale,ty=h/2-y*scale;tx=Math.max(w*(1-scale),Math.min(0,tx));ty=Math.max(h*(1-scale),Math.min(0,ty));stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;marker.style.transform=`translate(-50%,-50%) scale(${1/scale})`;map.classList.add('zoomed')}
function resetMapView(map){const st=getMapState(map);st.zoomed=false;map.classList.remove('zoomed');applyMapView(map)}
function toggleMapView(map){const st=getMapState(map);if(!st.country)return;st.zoomed=!st.zoomed;applyMapView(map)}
function enableTapZoom(map){map.addEventListener('click',e=>{e.stopPropagation();toggleMapView(map)});map.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleMapView(map)}});window.addEventListener('resize',()=>{if(getMapState(map).zoomed)applyMapView(map)})}
document.querySelectorAll('.map-wrap').forEach(enableTapZoom);
el.start.addEventListener('click',start);el.flip.addEventListener('click',toggleFlip);el.prev.addEventListener('click',prev);el.next.addEventListener('click',next);el.home.addEventListener('click',home);el.again.addEventListener('click',again);el.settings.addEventListener('click',settings);loadData();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}</script>
</body></html>
